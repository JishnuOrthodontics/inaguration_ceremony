<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Inauguration Controller — Biomechanics Unveiled 2.0</title>
  <meta name="description" content="Tap to charge the inauguration energy">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Optional 3D backdrop -->
  <canvas id="controller-canvas"></canvas>

  <!-- Full-screen tap catcher — always works, even if 3D fails -->
  <button type="button" id="tap-surface" aria-label="Tap to charge inauguration energy"></button>

  <!-- Status Overlay (visual only — does not block taps) -->
  <div id="status-overlay">
    <div class="event-badge">
      <span class="badge-icon">⚡</span>
      BIOMECHANICS UNVEILED 2.0
    </div>

    <div class="progress-ring-container">
      <svg class="progress-ring" viewBox="0 0 200 200">
        <circle class="progress-ring-bg" cx="100" cy="100" r="90" />
        <circle id="progress-circle" class="progress-ring-fill" cx="100" cy="100" r="90" />
      </svg>
      <div class="progress-center">
        <span id="progress-percent" class="progress-number">0</span>
        <span class="progress-symbol">%</span>
      </div>
    </div>

    <p id="status-text" class="status-text">Tap anywhere to charge</p>
    <p id="tap-count" class="tap-count">0 / 50</p>
  </div>

  <div id="tap-prompt" class="tap-prompt">
    <div class="tap-icon">👆</div>
    <span>TAP TO BEGIN</span>
  </div>

  <div id="revealed-screen" class="revealed-screen hidden">
    <div class="revealed-content">
      <div class="celebration-emoji">🎉</div>
      <h1>Inaugurated!</h1>
      <h2>Biomechanics Unveiled 2.0</h2>
      <p>National Workshop — Mastering the Art of Tooth Movement</p>
      <p class="revealed-subtitle">Malabar Dental College & Research Centre</p>
      <a href="/assets/Biomechanics-Unveiled-2.0-Brochure.pdf"
         download="Biomechanics Unveiled 2.0 Broucher.pdf"
         class="view-brochure-btn">
        View Brochure
      </a>
    </div>
  </div>

  <!-- Core first (taps + socket). Local vendor — no CDN dependency. -->
  <script src="/vendor/socket.io.min.js"></script>
  <script src="controller-core.js"></script>
  <script type="module">
    import('./controller.js').catch((err) => {
      console.warn('[Controller] 3D visuals unavailable — taps still work.', err);
      document.body.classList.add('no-3d');
    });
  </script>

</body>
</html>
